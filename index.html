<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>面面家計簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a quiet ledger. Summary strip on top, the month's truth first,
   then the evidence (transactions), then tools (import, plan). Indigo ink on cool paper. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --ink:#1a2232; --muted:#5c6577; --line:#dde2ea;
  --accent:#3456a3; --accent-soft:#e7edf9;
  --good:#2b7a56; --good-soft:#e2f2ea; --warn:#a2650c; --warn-soft:#fbefd9; --bad:#ae3a34; --bad-soft:#f8e2e0;
  --font-d:'Noto Serif SC', 'Songti SC', serif;
  --font-b:'Noto Sans SC', system-ui, 'PingFang SC', 'Hiragino Sans', 'Microsoft YaHei', sans-serif;
  --font-n:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151d; --surface:#191f2a; --ink:#e6eaf1; --muted:#99a2b4; --line:#2a3242;
    --accent:#8fa9ee; --accent-soft:#222c43;
    --good:#5fc596; --good-soft:#18302a; --warn:#e3aa50; --warn-soft:#33281a; --bad:#f07f78; --bad-soft:#3a2023;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151d; --surface:#191f2a; --ink:#e6eaf1; --muted:#99a2b4; --line:#2a3242;
  --accent:#8fa9ee; --accent-soft:#222c43;
  --good:#5fc596; --good-soft:#18302a; --warn:#e3aa50; --warn-soft:#33281a; --bad:#f07f78; --bad-soft:#3a2023;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.55}
.num{font-family:var(--font-n);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:1120px;margin:0 auto;padding:20px 20px 64px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.brand h1{font-family:var(--font-d);font-size:26px;margin:0;line-height:1.2;text-wrap:balance}
.brand .sub{color:var(--muted);font-size:13px}
.month{display:flex;align-items:center;gap:6px}
.month b{font-family:var(--font-d);font-size:19px;min-width:120px;text-align:center}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:16px}
.iconbtn:hover{border-color:var(--accent)}
.sec{display:block;font-size:12px;font-weight:400;color:var(--muted);letter-spacing:0;margin-top:2px}
.amt .sec,.subbar .sec{display:inline;margin-left:4px}
.amt .sec::before,.subbar .sec::before{content:"/ "}
.dualbtn{font-size:12px;padding:4px 9px;border-radius:999px}
.dualbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.dispsel select{font-size:12px;padding:4px 6px;border-radius:999px}
.savepill{cursor:pointer;font-size:12px;color:var(--muted);border:1px solid var(--line);padding:3px 10px;border-radius:999px;background:var(--surface);white-space:nowrap}
.savepill.ok{color:var(--good)} .savepill.err{color:var(--bad);border-color:var(--bad)}
nav.tabs{display:flex;gap:4px;margin:18px 0 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:500;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab small{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.demo{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);border-radius:10px;padding:10px 14px;margin-top:14px;font-size:14px}
.demo[hidden]{display:none}
.grid{display:grid;gap:14px}
.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.two{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h2{font-size:15px;margin:0 0 2px;font-weight:700}
.card .h2sub{font-size:12px;color:var(--muted);margin:0 0 12px}
.tile .lab{font-size:13px;color:var(--muted)}
.tile .val{font-size:24px;font-weight:600;margin-top:2px}
.tile .foot{font-size:12px;color:var(--muted);margin-top:4px}
:root{ --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948; --c-other:#8a909b; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; --c-other:#7b818c; } }
:root[data-theme="dark"]{ --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; --c-other:#7b818c; }
.asset-hero{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.asset-hero .big{font-size:34px;font-weight:600;line-height:1.1}
.asset-title{font-family:var(--font-d);font-size:20px;margin:0}
.goal{margin-top:12px}
.goal .track{height:10px}
.agroup{margin-top:16px}
.agroup h3{font-size:14px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.aitem{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.aitem:last-child{border-bottom:0}
.sw{width:10px;height:10px;border-radius:3px}
.aitem .nm{font-size:14px}
.aitem .sub{font-size:12px;color:var(--muted)}
.aitem .val{text-align:right}
.aitem .acts{grid-column:2 / 4;justify-content:flex-start}
.aform{grid-column:1 / 4;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:4px}
.donut-wrap{display:grid;grid-template-columns:minmax(200px,260px) minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:640px){.donut-wrap{grid-template-columns:1fr}}
.donut path{cursor:default}
.donut path:hover{opacity:.85}
.legend-list .li{font-size:13px}
.tilebtn{appearance:none;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
.tilebtn:hover{border-color:var(--accent)}
.tilebtn:hover .lab{color:var(--accent)}
.tile.excl{background:var(--accent-soft);border-color:transparent}
.pos{color:var(--good)} .neg{color:var(--bad)}
.alerts{display:grid;gap:8px;margin:14px 0}
.alert{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;border-radius:10px;padding:10px 14px;font-size:14px;border:1px solid}
.alert.warn{background:var(--warn-soft);border-color:var(--warn)}
.alert.info{background:var(--accent-soft);border-color:transparent}
.bars{display:grid;gap:10px}
.bar .row1{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar .row1 .amt{white-space:nowrap}
.catlink{appearance:none;border:0;background:none;padding:0;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.catlink:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.catbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:14px}
.track{position:relative;height:8px;border-radius:99px;background:var(--line);margin-top:4px;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent)}
.fill.good{background:var(--good)} .fill.warn{background:var(--warn)} .fill.bad{background:var(--bad)}
.bar .row2{font-size:12px;color:var(--muted)}
.list{display:grid;gap:0}
.li{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.li:last-child{border-bottom:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.dup{background:var(--bad-soft);color:var(--bad)}
.pill.xfer{background:var(--accent-soft);color:var(--accent)}
.pill.sus{background:var(--warn-soft);color:var(--warn)}
.pill.none{border-color:var(--line);color:var(--muted)}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500}
.btn.sm{font-size:12px;padding:3px 8px;border-radius:6px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;padding:4px 10px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
input[type=text],input[type=number],input[type=search],select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
input[type=number]{width:110px}
textarea{width:100%;min-height:120px;font-family:var(--font-n);font-size:12px}
.tablewrap tfoot td{border-top:1px solid var(--line);border-bottom:0}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--bg);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.excluded td{color:var(--muted)}
tr.excluded td .desc{text-decoration:line-through;text-decoration-color:var(--line)}
tr.spreadorig td.r.num{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.why{font-size:12px;color:var(--muted);margin-top:2px}
.src{font-size:12px;color:var(--muted);white-space:nowrap}
td select{font-size:13px;padding:3px 6px;max-width:150px}
.acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.drop{display:grid;place-items:center;text-align:center;border:2px dashed var(--line);border-radius:12px;padding:28px 16px;background:var(--surface);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop .big{font-size:16px;font-weight:500}
.drop .small{font-size:13px;color:var(--muted)}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.fields{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.muted{color:var(--muted)} .small{font-size:13px}
.steps{display:grid;gap:14px}
.kv{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}
.kv span b{font-weight:600}
.trend{width:100%;height:auto;max-height:240px;display:block}
.trend text{fill:var(--muted);font-size:11px;font-family:var(--font-b)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:10px;font-size:14px;max-width:min(92vw,560px);z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toast[hidden]{display:none}
.empty{color:var(--muted);font-size:14px;padding:18px 0;text-align:center}
.planrow{display:grid;grid-template-columns:minmax(0,1.4fr) 120px minmax(0,1fr) minmax(0,1fr) 34px;gap:8px;align-items:center;margin-bottom:8px}
.planrow input,.planrow select{width:100%}
@media (max-width:640px){.planrow{grid-template-columns:1fr 1fr}.planrow .x{justify-self:end}}
.budgetgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;align-items:start}
.subbars{margin:6px 0 2px 12px;padding-left:10px;border-left:2px solid var(--line);display:grid;gap:6px}
.subbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;font-size:13px}
.subbar .track{grid-column:1 / 3;height:5px;margin-top:0}
.firow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}
.firow input,.firow select{width:100%}
.bcat{border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:grid;gap:6px;align-content:start}
.bcat.open{background:var(--bg)}
.btoggle{appearance:none;border:0;background:none;font:inherit;color:inherit;width:100%;padding:2px 0;cursor:pointer;text-align:left}
.btoggle:hover .chev,.btoggle:hover{color:var(--accent)}
.chev{display:inline-block;width:14px;color:var(--muted)}
.bsum{padding-left:14px}
.bfoot{display:flex;gap:6px;justify-content:flex-end}
.bhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.bhead input{width:110px}
.bsub{display:grid;grid-template-columns:minmax(0,1fr) 84px 74px 30px;gap:6px;align-items:center;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.bsub:last-child{border-bottom:0}
.bsub .bkw{grid-column:1 / -1;font-size:12px;color:var(--muted)}
.bsub select.unit,.bin select.unit{font-size:12px;padding:3px 4px}
.bin{display:inline-flex;gap:4px;align-items:center}
.bin input{width:96px}
.bsub input{width:100%;font-size:13px;padding:4px 7px}
.bsub .iconbtn{width:30px;height:30px;font-size:14px}
.budgetgrid label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
@media (prefers-reduced-motion: no-preference){.fill{transition:width .3s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>面面家計簿</h1>
      <div class="sub">每月真实收支 · 毎月（まいつき）の本当（ほんとう）の収支（しゅうし）</div>
    </div>
    <div class="month">
      <button class="iconbtn" id="prevM" aria-label="上个月">‹</button>
      <b id="monthLabel">—</b>
      <button class="iconbtn" id="nextM" aria-label="下个月">›</button>
      <label class="dispsel" title="显示用的货币"><select id="dispCur" aria-label="显示货币"><option value="JPY">¥ 日元显示</option><option value="CNY">元 人民币显示</option><option value="USD">$ 美元显示</option></select></label>
      <button class="btn dualbtn" id="dualBtn" title="同时显示两种货币">双币</button>
      <span class="savepill" id="savePill">连接中…</span>
    </div>
  </header>
  <div class="demo" id="demoBar" hidden>
    <span>这是<b>示例数据</b>，演示查重和转账识别，不会保存。导入第一份账单或连接同步时会自动清掉。</span>
    <button class="btn sm" data-act="clear-demo">清掉示例，从空白开始</button>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab" data-v="overview">本月概览<small>概要（がいよう）</small></button>
    <button class="tab" data-v="txns">明细与查重<small>明細（めいさい）</small></button>
    <button class="tab" data-v="import">上传账单<small>取込（とりこみ）</small></button>
    <button class="tab" data-v="plan">固定支出与预算<small>固定費（こていひ）・予算（よさん）</small></button>
  </nav>
  <main id="view"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
// CORE-START
const EXP_CATS = [
  ['food','超市·便利店'],['eat','外食·咖啡·外卖'],['home','房租·住房'],['util','水电燃气'],['tel','通信·网络'],
  ['sub','订阅服务'],['trans','交通'],['shop','购物·日用'],['cat','面面'],['health','医疗·药妆'],
  ['fun','娱乐·爱好'],['travel','旅游'],['edu','学习·书'],['work','工作·素材'],['social','人情·社交'],['ins','保险·税金'],['cash','现金取出'],
  ['card','信用卡还款（未导入明细）'],['wallet','钱包充值（未导入明细）'],['other','其他支出'],['save','储蓄·投资'],['reimb','报销（先垫付）']
];
const INC_CATS = [['salary','工资'],['side','副业收入'],['refund','退款'],['reimb_in','报销到账'],['inc_other','其他收入']];
const CAT_NAME = Object.fromEntries([...EXP_CATS, ...INC_CATS]);
const SRC_TYPES = [['card','信用卡'],['bank','银行账户'],['wallet','电子钱包（PayPay等）'],['app','记账App汇总'],['other','其他']];
const SRC_TYPE_NAME = Object.fromEntries(SRC_TYPES);

function norm(s){
  return String(s ?? '').normalize('NFKC').toUpperCase()
    .replace(/[\s　]+/g,'')
    .replace(/[・･,，.。()（）\[\]【】「」『』*＊_\-－―‐−/／\\|:：;；'"`’”“!！?？#＃&＆+＋~〜]/g,'');
}
function spaced(s){
  return ' ' + String(s ?? '').normalize('NFKC').toUpperCase().replace(/[^0-9A-Z぀-ヿ㐀-鿿]+/g,' ') + ' ';
}
function kwHit(raw, n, kw){
  if (/^[A-Z0-9]{1,3}$/.test(kw)) {
    return new RegExp('(^|[^A-Z0-9])' + kw + '([^A-Z0-9]|$)').test(spaced(raw));
  }
  return n.includes(kw) || (kw.length >= 3 && loose(n).includes(loose(kw)));
}
function loose(n){ return n.replace(/ー/g,''); }

const RULES_SRC = [
  ['travel',['楽天トラベル','ラクテントラベル','じゃらん','JALAN','一休','IKYU','BOOKINGCOM','AGODA','EXPEDIA','AIRBNB','HOTELSCOM','TRIPCOM','携程','飞猪','去哪儿','ホテル','HOTEL','旅館','民宿','酒店','宾馆','ツアー','HIS','JTB','KLOOK','KKDAY','入場券','観光']],
  ['cat',   ['宠物','猫粮','猫砂','猫罐']],
  ['eat',   ['美团','饿了么','瑞幸','LUCKIN','喜茶','奈雪','肯德基','麦当劳','星巴克','海底捞','餐厅','饭店','外卖']],
  ['food',  ['盒马','超市','便利店','全家','罗森','美宜佳','永辉','叮咚','朴朴']],
  ['trans', ['滴滴','地铁','公交','高德打车','曹操出行','铁路','12306','航空']],
  ['tel',   ['中国移动','中国联通','中国电信','话费']],
  ['sub',   ['爱奇艺','腾讯视频','优酷','哔哩哔哩','BILIBILI','网易云','QQ音乐','芒果TV','百度网盘']],
  ['shop',  ['淘宝','天猫','京东','拼多多','唯品会','闲鱼','小红书','行吟信息','抖音商城','抖音电商']],

function mapBillCat(bc, out){
  const n = String(bc||'').normalize('NFKC');
  if (!n) return null;
  if (/报销|報銷|立替|経費精算|精算/.test(n)) return out ? 'reimb' : 'reimb_in';
  if (!out) {
    if (/工资|薪|給与|給料|賞与|奖金/.test(n)) return 'salary';
    if (/退款|返金|返品|退货/.test(n)) return 'refund';
    if (/副业|副業|兼职|事業/.test(n)) return 'side';
    return null;
  }
  for (const [c, re] of BILL_CATS) if (re.test(n)) return c;
  return null;
}

function parseAmount(s){
  if (s == null) return NaN;
  let t = String(s).normalize('NFKC').trim().replace(/[−–—‐]/g,'-');
  if (!t || /^-+$/.test(t)) return NaN;
  let neg = false;
  if (/^\(.*\)$/.test(t)) neg = true;
  if (/^[-▲△]/.test(t) || /-$/.test(t)) neg = true;
  const digits = t.replace(/[^0-9.]/g,'');
  if (!digits || !/[0-9]/.test(digits)) return NaN;
  const v = parseFloat(digits);
  if (!isFinite(v)) return NaN;
  return neg ? -v : v;
}

function parseDate(s, refYear){

  if ((m = t.match(/^(?:R|令和)\s*(\d{1,2})\s*[.\/年]\s*(\d{1,2})\s*[.\/月]\s*(\d{1,2})/))) return validYMD(2018 + +m[1], m[2], m[3]);

function encScore(t){
  const h = t.slice(0, 6000);

  for (const k of ENC_HINTS) if (h.includes(k)) sc += 30;

  sc += (h.match(/[\u3041-\u3096]/g) || []).length;
  sc += 2 * (h.match(ZH_ONLY) || []).length;

}
function decodeBuffer(buf){
  const u8 = new Uint8Array(buf);
  if (u8[0]===0xFF && u8[1]===0xFE) return new TextDecoder('utf-16le').decode(u8.subarray(2));
  if (u8[0]===0xFE && u8[1]===0xFF) return new TextDecoder('utf-16be').decode(u8.subarray(2));
  try { return new TextDecoder('utf-8',{fatal:true}).decode(u8).replace(/^\uFEFF/,''); } catch(e){}
  const cands = [];
  for (const enc of ['shift_jis','gb18030']) { try { cands.push(new TextDecoder(enc).decode(u8)); } catch(e){} }
  if (!cands.length) return new TextDecoder('utf-8').decode(u8);
  cands.sort((a,b)=>encScore(b)-encScore(a));
  return cands[0];
}
function parseCSV(text){
  const first = text.split(/\r?\n/).slice(0,10).join('\n');
  const delim = (first.match(/\t/g)||[]).length > (first.match(/,/g)||[]).length ? '\t' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell=''; }
    else if (c === '\n' || c === '\r') { if (c==='\r' && text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r=>r.map(c=>c.trim())).filter(r=>r.some(c=>c!==''));
}

function findDirCol(rows, start, exclude){
  const sample = rows.slice(start, start + 80);
  let best = -1, bestF = 0;
  const ncol = Math.max(0, ...sample.map(r=>r.length));
  for (let c=0;c<ncol;c++){
    if (exclude.includes(c)) continue;
    let n = 0, hit = 0;
    for (const r of sample){ const v = norm(r[c]); if (!v) continue; n++; if (DIR_IN.test(v) || DIR_OUT.test(v) || DIR_NONE.test(v)) hit++; }
    if (n >= 2 && hit/n > bestF) { bestF = hit/n; best = c; }
  }
  return bestF >= 0.6 ? best : -1;
}

      if (!h.includes(kw)) continue;
      if ((key === 'amt' || key === 'out' || key === 'inn') && HKN.bad.some(b=>h.includes(b))) continue;

function detectLayout(rows){

    for (const key of ['date','desc','amt','out','inn']) if (hdr.some(h=>h && h.length<20 && HKN[key].some(k=>h.includes(k)))) score++;
    if (score > bestScore) { bestScore = score; best = r; }
  }
  if (bestScore >= 2) {
    const hdr = rows[best].map(norm);
    const L = { headerRow: best, cols: rows[best].map((h,i)=>h || ('列'+(i+1))), dateCol:-1, descCols:[], amtCol:-1, outCol:-1, inCol:-1 };
    L.dateCol = hdrFind(hdr,'date',[]);
    const d1 = hdrFind(hdr,'desc',[L.dateCol]);

    const used = [L.dateCol, ...L.descCols];
    L.inCol = hdrFind(hdr,'inn',used);

// --- merge two copies (this device vs. GitHub) ---
function mergeState(local, remote){
  const del = { ...(remote.del||{}) };
  for (const [k,v] of Object.entries(local.del||{})) if (!del[k] || del[k] < v) del[k] = v;
  const cutoff = Date.now() - 400*86400000;
  for (const k of Object.keys(del)) if (del[k] < cutoff) delete del[k];
  const union = (kind, a, b, idKey) => {
    const m = new Map();
    for (const x of a||[]) m.set(x[idKey], x);
    for (const x of b||[]) { const o = m.get(x[idKey]); if (!o || (x.u||0) > (o.u||0)) m.set(x[idKey], x); }
    return [...m.values()].filter(x => !(del[kind+':'+x[idKey]] && del[kind+':'+x[idKey]] >= (x.u||0)));
  };
  const ls = local.settings||{}, rs = remote.settings||{};
  return {
    v:2,
    sources: union('s', remote.sources, local.sources, 'id'),
    settings: (rs.su||0) > (ls.su||0) ? rs : ls,
    imports: union('i', remote.imports, local.imports, 'id').sort((a,b)=>(a.at||'')<(b.at||'')?-1:1),
    txns: union('t', remote.txns, local.txns, 'i'),
    assets: union('a', remote.assets, local.assets, 'id'),
    del
  };
}

// --- encryption: PBKDF2 → AES-GCM, gzip when the browser supports it ---
const b64 = {
  enc(u8){ let s=''; for (let i=0;i<u8.length;i+=0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i+0x8000)); return btoa(s); },
  dec(str){ const bin = atob(str); const u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return u; }
};
async function gz(u8, inflate){
  const cs = inflate ? new DecompressionStream('gzip') : new CompressionStream('gzip');
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(cs)).arrayBuffer());
}
async function keyFor(pass, salt, it){
  const tag = b64.enc(salt) + '|' + (it||KDF_IT) + '|' + pass;
  if (Sync.keyCache && Sync.keyCache.tag === tag) return Sync.keyCache.key;
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations: it||KDF_IT, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
  Sync.keyCache = { tag, key };
  return key;
}
async function encryptState(state, pass){
  if (!Sync.salt) Sync.salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await keyFor(pass, Sync.salt, KDF_IT);
  let data = new TextEncoder().encode(JSON.stringify(state)), z = 0;
  if (typeof CompressionStream !== 'undefined') { data = await gz(data); z = 1; }
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, data));
  return { app:'mianmian-ledger', v:1, kdf:{ name:'PBKDF2-SHA256', it:KDF_IT, salt:b64.enc(Sync.salt) }, iv:b64.enc(iv), z, ct:b64.enc(ct) };
}
async function decryptState(file, pass){
  if (!file || file.app !== 'mianmian-ledger' || !file.ct) throw { code:'badfile' };
  const salt = b64.dec(file.kdf.salt);
  const key = await keyFor(pass, salt, file.kdf.it);
  let data;
  try { data = new Uint8Array(await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64.dec(file.iv) }, key, b64.dec(file.ct))); }
  catch(e){ throw { code:'badpass' }; }
  if (file.z) {
    if (typeof DecompressionStream === 'undefined') throw { code:'oldbrowser' };
    data = await gz(data, true);
  }
  Sync.salt = salt;
  return JSON.parse(new TextDecoder().decode(data));
}

// --- GitHub contents API ---
async function gh(method, url, body){
  let r;
  try {
    r = await fetch('https://api.github.com' + url, { method, cache:'no-store',
      headers: { Authorization:'Bearer ' + Sync.cfg.token, Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28', ...(body?{'Content-Type':'application/json'}:{}) },
      body: body ? JSON.stringify(body) : undefined });
  } catch(e){ throw { code:'offline' }; }
  if (r.status === 404) return { status:404 };
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw { code:'gh', status:r.status, message:j.message || r.statusText };
  return { status:r.status, json:j };
}
const repoPath = () => '/repos/' + Sync.cfg.repo.split('/').map(encodeURIComponent).join('/');
async function ghRepo(){ return gh('GET', repoPath()); }
async function ghGet(){
  const r = await gh('GET', repoPath() + '/contents/' + FILE);
  if (r.status === 404) return null;
  let content = r.json.content;
  if (!content || r.json.encoding !== 'base64') { const bl = await gh('GET', repoPath() + '/git/blobs/' + r.json.sha); content = bl.json.content; }
  return { sha:r.json.sha, file: JSON.parse(new TextDecoder().decode(b64.dec(content.replace(/\s/g,'')))) };
}
async function ghPut(file, sha){
  const content = b64.enc(new TextEncoder().encode(JSON.stringify(file)));
  const r = await gh('PUT', repoPath() + '/contents/' + FILE, { message:'sync ' + new Date().toISOString().slice(0,16), content, ...(sha?{sha}:{}) });
  Sync.sha = r.json && r.json.content ? r.json.content.sha : null;
}
function syncErrText(e){
  if (!e) return '未知错误';
  if (e.code === 'badpass') return '同步密码不对，解不开 GitHub 上的数据。';
  if (e.code === 'offline') return '连不上 GitHub，可能是网络问题。改动已存在这台设备，联网后会自动同步。';
  if (e.code === 'oldbrowser') return '这个浏览器太旧，解不开压缩数据，请换个新一点的浏览器。';
  if (e.code === 'badfile') return '仓库里的 ' + FILE + ' 不是这个账本的文件。';
  if (e.code === 'notprivate') return '这个仓库是公开的。账单数据只能放进私有仓库，请在 GitHub 上把它改成 Private。';
  if (e.code === 'norepo') return '找不到这个仓库，或者 token 没有它的权限。检查仓库名，以及 token 的 Repository access 里有没有选它。';
  if (e.code === 'gh') {
    if (e.status === 401) return 'token 无效或过期了，请在 GitHub 重新生成一个。';
    if (e.status === 403) return 'token 没有写入权限。生成 token 时 Contents 要选 Read and write。';
    return 'GitHub 返回错误 ' + e.status + '：' + (e.message||'');
  }
  return e.message || String(e);
}
async function syncNow(opts){

      const rs = await decryptState(remote.file, Sync.pass);

      const beforeTx = new Map(S.txns.map(x=>[x.i, x.u||0]));
      applyState(mergeState(stateBody(), rs));

      analyze(S.txns, S.sources, S.settings.learned);

    } else Sync.dirty = true;

async function connectSync(repo, token, pass, remember){
  repo = (repo||'').trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,'');
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { Sync.err = '仓库要写成「用户名/仓库名」'; return false; }
  if (!token || token.length < 20) { Sync.err = '请填 GitHub token'; return false; }
  if (!pass || pass.length < 8) { Sync.err = '同步密码至少 8 位'; return false; }
  const prevCfg = Sync.cfg, prevPass = Sync.pass;
  Sync.cfg = { repo, token: token.trim() }; Sync.pass = pass; Sync.salt = null; Sync.sha = null;
  try {
    const r = await ghRepo();
    if (r.status === 404) throw { code:'norepo' };
    if (!r.json.private) throw { code:'notprivate' };
    if (r.json.permissions && r.json.permissions.push === false) throw { code:'gh', status:403 };
    const remote = await ghGet();
    if (remote) await decryptState(remote.file, pass);
  } catch(e){
    Sync.err = syncErrText(e); Sync.cfg = prevCfg; Sync.pass = prevPass; return false;
  }
  if (remember) Sync.cfg.pass = pass;
  saveCfg();
  if (S.demo) clearDemo(true);
  const ok = await syncNow();
  if (ok) S.month = latestMonth();
  return ok;
}
function b64url(u8){ return b64.enc(u8).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64url(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '='; return b64.dec(s); }
async function makeJoinLink(){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await keyFor(Sync.pass, salt, KDF_IT);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify({ repo:Sync.cfg.repo, token:Sync.cfg.token }))));
  const payload = b64url(new TextEncoder().encode(JSON.stringify({ v:1, s:b64.enc(salt), i:b64.enc(iv), c:b64.enc(ct) })));

}
async function useJoinLink(payload, pass, remember){

    const o = JSON.parse(new TextDecoder().decode(unb64url(payload)));
    const key = await keyFor(pass, b64.dec(o.s), KDF_IT);

function spreadRuleFor(x){
  if (x.sp) return x.sp.n > 1 ? x.sp : null;
  const n = norm(x.t);
  for (const r of (S.settings.spreads || [])) { const k = norm(r.kw||''); if (k && +r.n > 1 && n.includes(k)) return { n:+r.n, dir:r.dir||'fwd', rule:r.id }; }
  return null;
}
function refreshSpreads(){
  for (const x of S.txns) {
    delete x._spread;
    if (x.virt || !x.o || x.st !== 'ok') continue;
    const sp = spreadRuleFor(x); if (!sp) continue;
    x._spread = sp;
    const n = Math.min(24, sp.n), ym0 = ymOf(x.d), day = +x.d.slice(8,10);
    const start = sp.dir === 'back' ? shiftMonth(ym0, -n) : ym0;
    const q = curOfSrc(x.s) === 'JPY' ? 1 : 100;
    const part = Math.floor(x.a / n * q) / q;
    for (let k = 0; k < n; k++){
      const ym = shiftMonth(start, k); const [yy, mm] = ym.split('-').map(Number);
      const last = new Date(Date.UTC(yy, mm, 0)).getUTCDate();
      const a = k === n-1 ? Math.round((x.a - part*(n-1))*q)/q : part;
      S.txns.push({ i:'sp-'+x.i+'-'+k, s:x.s, d: ym + '-' + pad(Math.min(day, last)), t:x.t, a, o:1, c:x.c, sb:x.sb, st:'ok', m:1, mc:1, virt:1, spOf:x.i, spK:k+1, spN:n });
    }
  }
}
function refreshFixedIncome(){

    const kw = norm(f.kw || '');
    let ym = f.from, guard = 0;
    while (ym <= curYM && (!f.to || ym <= f.to) && guard++ < 240) {

        if (seen) status[f.id + ym] = { seen };

function reviewCard(){

  const M = monthSummary(S.txns, RM, CV);
  if (!M.count) return '';
  const hist = [RM, shiftMonth(RM,-1), shiftMonth(RM,-2)].map(ym => ({ ym, M: monthSummary(S.txns, ym, CV) })).filter(o => o.M.count);
  const subSpent = (ym, k) => { const by = {}; for (const x of S.txns) { if (ymOf(x.d)!==ym || x.st!=='ok' || x._spread || !x.o || x.c!==k) continue; const v = CV(x); if (v == null) continue; const sid = subOf(x); if (sid) by[sid] = (by[sid]||0) + v; } return by; };

  const rows = [];

    const items = (BI[k] || []).filter(i => +i.amt > 0 && i.amtJ != null);
    let unassigned = 0;
    if (items.length) for (const o of hist) for (const x of S.txns) { if (ymOf(x.d)!==o.ym || x.st!=='ok' || x._spread || !x.o || x.c!==k || subOf(x)) continue; unassigned += CV(x) || 0; }
    const lines = items.length
      ? items.map(i => ({ k, sub: i.id, name: (CAT_NAME[k]||k) + ' · ' + (i.name||'未命名'), budget: +i.amtJ, series: hist.map(o => subSpent(o.ym, k)[i.id] || 0) }))
      : [{ k, sub: '', name: CAT_NAME[k]||k, budget: +budgets[k], series: hist.map(o => o.M.byCat[k] || 0) }];
    for (const L of lines) {
      const spent = L.series[0], n = L.series.length, avg = L.series.reduce((a,v)=>a+v,0) / n;
      let tip = '', sugg = 0, kind = 'ok';
      if (n >= 2 && avg > L.budget * 1.1) { sugg = r500(avg); kind = 'up'; tip = `近 ${n} 个月平均花 ${yen(avg)}，比预算多。可以把预算调到 ${yen(sugg)}，或者下个月有意识地少花一点。`; }
      else if (n >= 2 && L.series.every(v => v < L.budget * 0.6) && !(L.sub && unassigned > 0)) { sugg = r500(avg * 1.1); kind = 'down'; tip = `近 ${n} 个月都只用了不到六成（平均 ${yen(avg)}）。可以把预算降到 ${yen(sugg)}，省下来的转去储蓄。`; }
      else if (spent > L.budget) { kind = 'over'; tip = n < 2 ? '这个月超了。数据还不够 2 个月，先观察一下再调预算。' : `这个月超了，不过近 ${n} 个月平均 ${yen(avg)} 还在预算附近，可能只是偶然。`; }
      if (L.sub && unassigned > 0 && kind === 'ok' && L.series.every(v => v < L.budget * 0.6)) { kind = 'note'; tip = `「${CAT_NAME[k]||k}」近 ${n} 个月还有 ${yen(unassigned)} 没指定小项，这一项的数字可能偏低。先把它们指定好，复盘才准。`; }
      rows.push({ ...L, spent, avg, n, tip, sugg, kind });

  return `<div class="card" style="margin-top:14px"><h2>${+RM.slice(5)}月预算复盘${RM!==S.month?'（上个月）':''}</h2>
    <p class="h2sub">设了预算的部分：花了 <b class="num">${yen(totalS)}</b> / 预算 <b class="num">${yen(totalB)}</b> · 超支 ${over.length} 项 · 平均值按最近 ${hist.length} 个有账单的月份算</p>

function viewTxns(){

function cellText(X, cell){

const armed = {};
function arm(btn, key, label){ if (armed[key] && Date.now()-armed[key] < 4000) { delete armed[key]; return true; } armed[key] = Date.now(); const old = btn.textContent; btn.textContent = label; setTimeout(()=>{ if (btn.isConnected) btn.textContent = old; }, 4000); return false; }

  switch(act){

    case 'set-xfer': if (x){ x.m=1; x.st='xfer'; x.w='你标记为转账/还款'; runAnalyze(); touch([x]); renderTxRows(); } break;

    case 'sus-no': if (x){ const o = S.txns.find(t=>t.i===x.sus); x.m=1; x.st='ok'; x.w='你确认过：不是重复'; if (o){ o.m=1; o.st='ok'; o.w='你确认过：不是重复'; } runAnalyze(); touch([x,o]); renderTxRows(); } break;
    case 'pdf-pass': { const P = S.pending; const pw = $('#pdfPass').value; if (P && pw) openFile(P.blob, pw); break; }
    case 'cancel-pending': S.pending = null; if (S.queue && S.queue.length) { toast('已跳过这个文件'); nextInQueue(); } else render(); break;

    case 'del-sp': if (arm(b, 'delsp'+id, '再点一次删除')) { S.settings.spreads = (S.settings.spreads||[]).filter(r=>r.id!==id); markDirty([], true); render(); } break;
    case 'add-fi': S.settings.fixedIncome = (S.settings.fixedIncome||[]).concat([{ id:'fi'+rid(), name:'', amt:0, cur:'JPY', cat:'inc_other', day:25, from: nowYM(), to:'', kw:'' }]); markDirty([], true); render(); break;

    case 'dl-csv': { const L = S.txns.filter(t=>ymOf(t.d)===S.month).sort((a,b)=>a.d<b.d?-1:1); const q = s=>'"'+String(s).replace(/"/g,'""')+'"'; const csv = '\uFEFF' + ['日期,内容,来源,分类,收支,金额,状态'].concat(L.map(t=>[t.d,q(t.t),q(srcName(t.s)),q(CAT_NAME[t.c]||''),t.o?'支出':'收入',t.a,{ok:'计入',dup:'重复',xfer:'转账'}[t.st]].join(','))).join('\n'); download('面面家計簿-' + S.month + '.csv', csv, 'text/csv'); break; }

    case 'join-connect': { const pass = $('#joinPass').value, rem = $('#joinRemember').checked; if (!pass) break; b.disabled = true; b.textContent = '连接中…'; useJoinLink(S.join, pass, rem).then(ok=>{ if (ok) { S.join = null; toast('连上了，数据已经同步过来'); go('overview'); } else render(); }); break; }

    case 'asset-rename': S.assetForm = { mode:'rename' }; render(); scrollAssets(); break;
    case 'asset-name-save': { const v = $('#assetNameIn').value.trim(); S.settings.assetName = v; S.assetForm = null; markDirty([], true); render(); scrollAssets(); break; }

      const name = $('#afName').value.trim(); if (!name) { toast('先填个名称'); break; }

    }
    case 'asset-inc-save': {
      const it = (S.assets||[]).find(a=>a.id===id); const v = +$('#afAmt').value, d = $('#afDate').value || todayStr();
      if (!it || !(v > 0)) { toast('填一下收入金额'); break; }
      const editId = b.dataset.edit;
      const dupe = S.txns.find(x=>x.s==='as-'+it.id && x.d===d && x.a===v && x.i!==editId);
      if (dupe && !arm(b, 'inc'+id+d+v, '这天已经记过一样的金额，再点一次确认')) break;
      const memo = $('#afMemo').value.trim();
      if (editId) {
        const x = S.txns.find(t=>t.i===editId);
        if (x) { Object.assign(x, { d, a: v, c: $('#afCat').value, t: memo || '手动记的收入' }); stamp(x); }
        S.assetForm = { mode:'inc', id };
        markDirty([]); toast('改好了'); render(); scrollAssets(); break;
      }
      S.txns.push({ i: rid(), s: 'as-'+it.id, f: 'manual', d, t: memo || '手动记的收入', a: v, o: 0, c: $('#afCat').value, m: 1, mc: 1, st: 'ok', u: Date.now() });
      markDirty([]); toast('记上了，已算进' + (+d.slice(5,7)) + '月收入'); render(); scrollAssets(); break;

    case 'asset-inc-del': { const x = S.txns.find(t=>t.i===id); if (!x) break; if (!arm(b, 'incdel'+id, '再点一次删除')) break; bury('t', x.i); S.txns = S.txns.filter(t=>t.i!==id); markDirty([]); render(); scrollAssets(); break; }
    case 'asset-del': {

      if (!arm(b, 'adel'+id, '再点一次：删除这项和它记过的收入')) break;
      bury('a', it.id); for (const t of S.txns) if (t.s==='as-'+it.id) bury('t', t.i);
      S.txns = S.txns.filter(t=>t.s!=='as-'+it.id); S.assets = S.assets.filter(a=>a.id!==id);
      S.assetForm = null; markDirty([]); render(); scrollAssets(); break;

      else { S.settings.budgetRaw = S.settings.budgetRaw || {}; const old = S.settings.budgetRaw[k] || { cur:'JPY' }; S.settings.budgetRaw[k] = { v: inCur(old.cur), cur: old.cur || 'JPY' }; }
      recomputeBudgets(); markDirty([], true); toast('预算已改成 ' + (rmb(v) || yen(v))); render(); break;
    }
    case 'goto-rates2': go('plan'); setTimeout(()=>{ const el = $('[data-rate]'); if (el) el.scrollIntoView({block:'center'}); }, 50); break;
    case 'refresh-rates': {

function subInfo(x){
  const items = (S.settings.budgetItems || {})[x.c];
  if (!items || !items.length || !x.o || x.sb === '-') return null;
  if (x.sb && items.some(i=>i.id===x.sb)) return { id:x.sb, how:'manual' };
  const l = (S.settings.learnedSub || {})[learnKey(x.t)];
  if (l && items.some(i=>i.id===l)) return { id:l, how:'learned' };
  const n = norm(x.t);
  for (const i of items) {
    const kws = String(i.kw||'').split(/[,，、;；\n]+/).map(k=>norm(k)).filter(k=>k.length >= 2 || /[\u3040-\u9fff]/.test(k));
    if (kws.some(k=>kwHit(x.t, n, k))) return { id:i.id, how:'kw' };
  }
  return null;
}
function subOf(x){ const r = subInfo(x); return r ? r.id : null; }
function toJ(v, cur){ v = +v || 0; if (!cur || cur === 'JPY') return v; const r = +(S.settings.rates||{})[cur]; return r > 0 ? v * r : null; }
function fromJ(vj, cur){ if (!cur || cur === 'JPY') return vj; const r = +(S.settings.rates||{})[cur]; return r > 0 ? vj / r : null; }
function rmb(vj){ const r = +(S.settings.rates||{}).CNY; return r > 0 ? Math.round(vj / r).toLocaleString('zh-CN') + ' 元' : null; }
function recomputeBudgets(){
  S.settings.budgetRaw = S.settings.budgetRaw || {};
  const Rw = S.settings.budgetRaw, BI = S.settings.budgetItems || {};
  for (const [k,v] of Object.entries(S.settings.budgets||{})) if (!Rw[k] && !(BI[k] && BI[k].length) && +v > 0) Rw[k] = { v:+v, cur:'JPY' };
  const out = {}; let missing = false;
  for (const k of new Set([...Object.keys(Rw), ...Object.keys(BI)])) {
    const items = BI[k];
    if (items && items.length) {
      let sum = 0;
      for (const i of items) { const j = toJ(i.amt, i.cur); i.amtJ = j; if (j == null) { if (+i.amt > 0) missing = true; continue; } sum += j; }
      if (sum > 0) out[k] = Math.round(sum);
    } else if (Rw[k] && +Rw[k].v > 0) {
      const j = toJ(Rw[k].v, Rw[k].cur);
      if (j == null) missing = true; else out[k] = Math.round(j);
    }
  }
  S.settings.budgets = out; S.budgetRateMissing = missing;
}
function usedCurs(){
  const set = new Set();
  if (dispCur() !== 'JPY') set.add(dispCur());
  if (S.settings.dualCur && secCur() && secCur() !== 'JPY') set.add(secCur());
  for (const x of S.sources) if (x.cur && x.cur !== 'JPY') set.add(x.cur);
  for (const a of (S.assets||[])) if (a.cur && a.cur !== 'JPY') set.add(a.cur);
  for (const r of Object.values(S.settings.budgetRaw||{})) if (r.cur && r.cur !== 'JPY') set.add(r.cur);
  for (const l of Object.values(S.settings.budgetItems||{})) for (const i of l) if (i.cur && i.cur !== 'JPY') set.add(i.cur);
  return [...set];
}
function staleRates(){
  if (S.demo) return [];
  const at = S.settings.ratesAt || {}, rates = S.settings.rates || {}, today = todayStr(), out = [];
  for (const c of usedCurs()) {
    if (!(+rates[c] > 0)) continue;
    if (!at[c]) { S.settings.ratesAt = at; at[c] = today; continue; }
    const days = dayDiff(today, at[c]);
    if (days > 30) out.push({ c, days });
  }
  return out;
}

async function fetchRate(base){

    try { const r = await fetch(u, { cache:'no-store' }); if (!r.ok) continue; const j = await r.json(); const v = +(j && j.rates && j.rates.JPY); if (v > 0) return { rate: Math.round(v*100)/100, date: j.date || '' }; } catch(e){}
  }

}

async function restoreFromFile(f){
